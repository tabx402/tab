[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["node_modules", "lib"]
solc_version = "0.8.28"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = ["@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/", "forge-std/=lib/forge-std/src/"]
fuzz.runs = 1024
invariant.runs = 128
invariant.depth = 64

[fmt]
line_length = 110
