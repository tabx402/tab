server {
    listen 80;
    listen [::]:80;
    server_name tab-preview.198.244.189.254.sslip.io;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://tab-preview.198.244.189.254.sslip.io$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tab-preview.198.244.189.254.sslip.io;
    ssl_certificate /etc/letsencrypt/live/tabagents-preview/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tabagents-preview/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    server_tokens off;
    root /var/www/tabagents/current;
    index index.html;
    client_max_body_size 16k;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:4297;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 15s;
        add_header Cache-Control "no-store" always;
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
