server {
    listen 80;
    listen [::]:80;
    server_name tabagents.io www.tabagents.io docs.tabagents.io;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.tabagents.io docs.tabagents.io;
    ssl_certificate /etc/letsencrypt/live/tabagents.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tabagents.io/privkey.pem;
    if ($host = docs.tabagents.io) { return 301 https://tabagents.io/protocol; }
    return 301 https://tabagents.io$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tabagents.io;
    ssl_certificate /etc/letsencrypt/live/tabagents.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tabagents.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    root /var/www/tabagents/current;
    index index.html;
    client_max_body_size 16k;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:4297;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 120s;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location /media/ {
        try_files $uri =404;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location /assets/ {
        gzip on;
        gzip_vary on;
        gzip_comp_level 6;
        gzip_min_length 1024;
        gzip_types text/css application/javascript image/svg+xml;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
