server {
    listen 80;
    listen [::]:80;
    server_name tab-preview.198.244.189.254.sslip.io;
    root /var/www/tabagents/current;
    index index.html;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:4297;
        include /etc/nginx/proxy_params;
        add_header Cache-Control "no-store" always;
    }
    location / { try_files $uri $uri/ /index.html; }
}
