server {
    listen 80;
    listen [::]:80;
    server_name tabagents.io www.tabagents.io docs.tabagents.io;
    root /var/www/tabagents/current;
    index index.html;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { try_files $uri $uri/ /index.html; }
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:4297;
        include /etc/nginx/proxy_params;
    }
}
